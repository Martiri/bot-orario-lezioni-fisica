name: Tracciamento Orario Lezioni Fisica UniBo

on:
  schedule:
    # Esecuzione notturna alle 01:30 ora italiana (Europe/Rome):
    # - Con ora legale (CEST, UTC+2): 01:30 Roma = 23:30 UTC del giorno precedente
    # - Con ora solare (CET, UTC+1):  01:30 Roma = 00:30 UTC
    - cron: '30 23 * * *'
    - cron: '30 0 * * *'

  workflow_dispatch: # Permette di avviarlo manualmente dalla scheda Actions con 1 click

permissions:
  contents: write
  issues: write

jobs:
  track-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esecuzione Tracciamento e Rilevamento Modifiche
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python orario_tracker.py

      - name: Salva storico e tabelle aggiornate nel repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/previous_schedule.json orario_lezioni.csv orario_oggi.md orario_settimana.md orario_completo.md orario_lezioni.html orario_lezioni.ics
          if git diff --staged --quiet; then
            echo "Nessun cambiamento nei file tracciati."
          else
            git commit -m "Aggiornamento orario e storico lezioni [skip ci]"
            git push
          fi

      - name: Carica tabelle scaricabili (GitHub Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: orario-fisica-tabelle
          retention-days: 14
          path: |
            orario_lezioni.csv
            orario_lezioni.ics
            orario_lezioni.html
            orario_oggi.md
            orario_settimana.md
